pipeline:
  name: ios-thin-client-test
  identifier: iosthinclienttest
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        repoName: ios-thin-client
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: MacOS
            arch: Arm64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Checkout submodules
                  identifier: checkout_submodules
                  spec:
                    shell: Sh
                    command: |
                      set -euo pipefail
                      git submodule sync --recursive
                      git submodule update --init --recursive
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_dependencies
                  spec:
                    shell: Sh
                    command: |
                      set -euo pipefail
                      chmod +x .harness/scripts/install-deps.sh
                      .harness/scripts/install-deps.sh
              - step:
                  type: RunTests
                  name: Run unit tests
                  identifier: run_unit_tests
                  spec:
                    language: Java
                    buildTool: Gradle
                    args: "--version"
                    shell: Sh
                    preCommand: |
                      echo "Skipping run-ci-reports.sh (disabled for debugging)"
                    testIntelligence:
                      enabled: false
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - .reports/**/junit.xml
        timeout: 30m
