pipeline:
  name: ios-thin-client-test
  identifier: iosthinclienttest
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        repoName: ios-thin-client
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: MacOS
            arch: Arm64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Checkout submodules
                  identifier: checkout_submodules
                  spec:
                    shell: Sh
                    command: |
                      set -euo pipefail
                      git submodule sync --recursive
                      git submodule update --init --recursive
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_dependencies
                  spec:
                    shell: Sh
                    command: |
                      set -euo pipefail
                      chmod +x .harness/scripts/install-deps.sh
                      .harness/scripts/install-deps.sh
              - step:
                  type: Run
                  name: Build and Test Swift 6 strict concurrency
                  identifier: swift6_strict_concurrency_check
                  spec:
                    shell: Sh
                    command: |
                      set -euo pipefail
                      # Package.swift stays on swift-tools-version 5.5 (toolchain compat), so this
                      # is the only place that actually validates the SDK against Swift 6 strict mode.
                      swift build -Xswiftc -swift-version -Xswiftc 6

                      # Headless macOS runners have no unlocked login keychain, so generic-password
                      # items never round-trip and KeychainCredentialStorage persistence tests fail.
                      # Create and unlock a temporary default keychain for this session.
                      KEYCHAIN_PATH="$(pwd)/ci.keychain-db"
                      security create-keychain -p "" "$KEYCHAIN_PATH"
                      security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                      security unlock-keychain -p "" "$KEYCHAIN_PATH"
                      security default-keychain -s "$KEYCHAIN_PATH"
                      security list-keychains -d user -s "$KEYCHAIN_PATH"

                      swift test -Xswiftc -swift-version -Xswiftc 6

              - step:
                  type: Run
                  name: Build and Test Swift 5
                  identifier: swift5
                  spec:
                    shell: Sh
                    command: |
                      set -euo pipefail
                      # Swift 5 is the mode we actually ship (Package.swift is swift-tools-version 5.5),
                      # so validate the shipped semantics first, then re-run under Swift 6 strict for
                      # forward-compat.
                      swift test
              - step:
                  type: RunTests
                  name: Run unit tests
                  identifier: run_unit_tests
                  spec:
                    language: Java
                    buildTool: Gradle
                    args: "--version"
                    shell: Sh
                    preCommand: bash .harness/scripts/run-ci-reports.sh
                    testIntelligence:
                      enabled: false
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - .reports/**/junit.xml
              - step:
                  type: Run
                  name: prepare coverage report
                  identifier: prepare_coverage_report
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      export HAS_COVERAGE
                      if [ -s coverage/lcov.info ]; then
                        HAS_COVERAGE=true
                        ls -la coverage/lcov.info
                      else
                        echo "No LCOV; skipping coverage upload"
                        HAS_COVERAGE=false
                      fi
                    outputVariables:
                      - name: HAS_COVERAGE
                  when:
                    stageStatus: Success
              - parallel:
                  - step:
                      name: harnessCoverage
                      identifier: harnessCoverage
                      when:
                        stageStatus: Success
                        condition: <+execution.steps.prepare_coverage_report.output.outputVariables.HAS_COVERAGE> == "true"
                      template:
                        templateRef: account.codeCoverage
                        versionLabel: v1
                        templateInputs:
                          type: Run
                          spec:
                            envVariables:
                              patch_coverage_percent: "80"
                              file_path: coverage/lcov.info
                              overall_coverage_percent: ""
                              ignore_failure: "false"
                              exclude: "**/.build/**,**/Tests/**,**/*Tests.swift,**/*.generated.swift"
        timeout: 30m
